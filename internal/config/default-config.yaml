# weather is optional: leave forecast_url_template empty to disable it
# entirely. When set, it fetches a short-term forecast and shows the Text
# of every matching condition on the today's-summary view. See
# WeatherConfig in internal/config/config.go for the full variable/operator
# reference. A condition may also set icon to additionally show that icon
# in the upcoming-schedule table's marker column for any week with at least
# one matching forecast day (as far ahead as the forecast source actually
# has data for), with a tooltip listing the matching day(s) and the
# variable values that triggered it. icon accepts a literal emoji/text/image
# URL, one of the built-in shorthand names "slippery", "snow", "rain", or a
# :emoji-name: shortcode (e.g. ":snowflake:", resolved the same way as
# special_dates icon/summary_icon/description_icon fields, see below).
#
# forecast_url_template/place below are the FMI (Harmonie surface model)
# endpoint and Espoo place name used while developing/testing this feature;
# conditions is left empty by default -- two illustrative examples that
# pair with the built-in "slippery"/"snow" icons:
#
# conditions:
#     - condition: "$MIN_TEMPERATURE <= 2"
#       text: Risk of black ice overnight -- consider sanding the walkways.
#       icon: slippery
#     - condition: "$MAX_SNOW > 5cm"
#       text: Significant snowfall expected -- prepare for snow removal.
