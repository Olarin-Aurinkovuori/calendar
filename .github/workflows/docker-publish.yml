name: Build and publish Docker image

# Builds the image defined by cmd/calendar/Dockerfile and
# publishes it to GitHub Container Registry (ghcr.io):
#   - every push to main/HEAD is published as the "unstable" tag.
#   - every tag matching v$MAJOR.$MINOR.$PATCH (e.g. v1.2.3) is published
#     under that same tag, verbatim.
#   - every push to a branch named test/image/$subject (a single path
#     segment, e.g. test/image/foo) is published as v0.0.0-$subject, for
#     ad hoc test builds without cutting a real release tag.
on:
  push:
    branches: [main, "test/image/*"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io requires a lowercase image path; github.repository may
      # contain uppercase characters if the owner/repo name does.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Decide the single tag this push publishes under: "unstable" for
      # main, the verbatim tag name for a vX.Y.Z tag push, or
      # v0.0.0-$subject for a test/image/$subject branch push.
      - name: Compute image tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "main" ]]; then
            tag="unstable"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          elif [[ "$REF_TYPE" == "branch" && "$REF_NAME" == test/image/* ]]; then
            subject="${REF_NAME#test/image/}"
            tag="v0.0.0-$subject"
          else
            echo "::error::unexpected ref for this workflow: $REF_TYPE $REF_NAME" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/calendar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            VCS_REF=${{ github.sha }}
